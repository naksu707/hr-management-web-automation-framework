name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

  cypress:
    name: Cypress · ${{ matrix.browser }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The public demo is shared and sometimes slow to answer: wait up to 3 minutes
      - name: Wait for the OrangeHRM demo
        run: |
          for attempt in $(seq 1 18); do
            if curl --silent --fail --max-time 20 --output /dev/null \
              https://opensource-demo.orangehrmlive.com/web/index.php/auth/login; then
              echo "The demo is up (attempt $attempt)"
              exit 0
            fi
            echo "The demo is not answering yet (attempt $attempt of 18), waiting 10 seconds"
            sleep 10
          done
          echo "::error::The OrangeHRM demo did not answer for 3 minutes"
          exit 1

      - name: Run the tests
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ matrix.browser }}

      - name: Upload the Mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-${{ matrix.browser }}
          path: cypress/reports
          # The .jsons folder has the totals shown on the report site
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: cypress/screenshots
          if-no-files-found: ignore

  report:
    name: Publish the reports
    needs: cypress
    # Runs even when a test failed, but only for main (not for pull requests)
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the Mochawesome reports
        uses: actions/download-artifact@v4
        with:
          pattern: mochawesome-*
          path: downloads

      - name: Build the report site
        run: bash .github/scripts/build-report-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
