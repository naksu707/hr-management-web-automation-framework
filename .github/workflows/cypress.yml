name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

  cypress:
    name: Cypress · ${{ matrix.browser }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The public demo is shared and sometimes slow to answer: wait up to 3 minutes
      - name: Wait for the OrangeHRM demo
        run: |
          for attempt in $(seq 1 18); do
            if curl --silent --fail --max-time 20 --output /dev/null \
              https://opensource-demo.orangehrmlive.com/web/index.php/auth/login; then
              echo "The demo is up (attempt $attempt)"
              exit 0
            fi
            echo "The demo is not answering yet (attempt $attempt of 18), waiting 10 seconds"
            sleep 10
          done
          echo "::error::The OrangeHRM demo did not answer for 3 minutes"
          exit 1

      - name: Run the tests
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ matrix.browser }}

      - name: Upload the Mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-${{ matrix.browser }}
          path: cypress/reports
          if-no-files-found: ignore

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: cypress/screenshots
          if-no-files-found: ignore
