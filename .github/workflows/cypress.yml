name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

  cypress:
    name: Cypress · ${{ matrix.browser }}
    needs: quality
    runs-on: ubuntu-latest
    # A run normally takes about 5 minutes per browser. Past 20 minutes the demo is
    # struggling, and waiting longer only fills the log with timeouts.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # One browser at a time: three parallel runs on the same shared demo make it
      # slow for all of them, and the tests then fail on timeouts instead of real defects.
      max-parallel: 1
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The public demo is shared and sometimes slow to answer. This step waits up to
      # 5 minutes, but it never stops the job: if the demo does not answer the quick check,
      # Cypress still tries (a browser often gets through when a plain request does not).
      - name: Wait for the OrangeHRM demo
        run: |
          deadline=$((SECONDS + 300))
          attempt=1
          while (( SECONDS < deadline )); do
            if curl --silent --fail --location --max-time 30 --output /dev/null \
              --user-agent "Mozilla/5.0 (X11; Linux x86_64) Cypress CI check" \
              https://opensource-demo.orangehrmlive.com/web/index.php/auth/login; then
              echo "The demo is up (attempt $attempt, after $SECONDS seconds)"
              exit 0
            fi
            echo "The demo is not answering yet (attempt $attempt, $SECONDS seconds so far)"
            attempt=$((attempt + 1))
            sleep 10
          done
          echo "::warning::The OrangeHRM demo did not answer the quick check for 5 minutes. Running the tests anyway."

      - name: Run the tests
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ matrix.browser }}

      - name: Upload the Mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-${{ matrix.browser }}
          path: cypress/reports
          # The .jsons folder has the totals shown on the report site
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: cypress/screenshots
          if-no-files-found: ignore

  report:
    name: Publish the reports
    needs: cypress
    # Runs even when a test failed, but only for main (not for pull requests)
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the Mochawesome reports
        uses: actions/download-artifact@v4
        with:
          pattern: mochawesome-*
          path: downloads

      - name: Build the report site
        run: bash .github/scripts/build-report-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub sometimes takes a few seconds to list the artifact it just received,
      # and the deploy fails with "No artifacts named github-pages". One retry after
      # a short wait fixes it, so a passing run is not marked as failed.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
